[project]
name = "dart-bias-correct"
version = "0.1.0"
description = "Bias correction module for the DART Pipeline"
readme = "README.md"
authors = [
    { name = "Abhishek Dasgupta", email = "abhishek.dasgupta@dtc.ox.ac.uk" },
]
requires-python = ">=3.11"
dependencies = [
    "metpy>=1.7.0",
    "python-cmethods>=2.3.1",
    "geoglue",
    "xclim>=0.57.0",
]

[project.scripts]
dart-bias-correct = "dart_bias_correct:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
geoglue = { git = "https://github.com/kraemer-lab/geoglue", rev = "59a760644be7532cb6a3fe19ac4b1a49fb1cafdf" }

[dependency-groups]
dev = ["ipykernel>=6.29.5", "pytest>=8.4.1"]
